<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Fonts: Montserrat (headings) + Inter (body) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Default meta (overridden per-page by react-helmet-async) -->
    <title>Zeta Construction | Construction Company in Pokhara, Nepal</title>
    <meta
      name="description"
      content="Zeta Construction is a leading construction company in Pokhara, Nepal specializing in residential homes, commercial buildings, renovation, and building design across Gandaki Province."
    />
    <meta name="theme-color" content="#1e40af" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_NP" />
    <meta property="og:site_name" content="Zeta Construction Pokhara" />
    <meta property="og:title" content="Zeta Construction | Construction Company in Pokhara, Nepal" />
    <meta
      property="og:description"
      content="Premium residential and commercial construction services in Pokhara, Nepal. Building dreams since 2009."
    />

    <!-- Local Business Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Zeta Construction",
      "description": "Premier construction company in Pokhara, Nepal specializing in residential and commercial construction.",
      "url": "https://zetaconstruction.com.np",
      "telephone": "+977 984-6740399",
      "email": "[EMAIL]@zetaconstruction.com.np",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "[ADDRESS]",
        "addressLocality": "Pokhara",
        "addressRegion": "Gandaki Province",
        "addressCountry": "NP"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "28.2096",
        "longitude": "83.9856"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday"],
          "opens": "08:00",
          "closes": "18:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Saturday",
          "opens": "09:00",
          "closes": "15:00"
        }
      ],
      "sameAs": [
        "https://facebook.com/",
        "https://instagram.com/"
      ]
    }
    </script>
  </head>
  <body>
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-orange-500 focus:text-white focus:rounded-md focus:font-semibold">
      Skip to main content
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
